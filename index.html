<title>Food log</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--acc:#8aa886;--accd:#4f6b4e;--bg:#f6f8f3;--card:#fff;--ink:#26302a;--mute:#69756c;--line:#e1e8de;--track:#e6ece3;--warn:#b9503a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 18px/1.4 Jost,ui-rounded,system-ui,sans-serif;overflow-x:hidden}
main{padding:16px 16px 110px;max-width:520px;margin:0 auto;padding-top:calc(16px + env(safe-area-inset-top))}
h2{font-size:24px;margin:6px 0 12px;font-weight:800}h3{font-size:18px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin:0 0 14px}
.btn{display:block;width:100%;min-height:54px;border:0;border-radius:16px;background:var(--accd);color:#fff;font:800 18px Jost,system-ui,sans-serif;padding:12px 16px;text-align:center}
.btn.alt{background:#e9efe6;color:var(--accd)}.btn.red{background:#f4e3de;color:var(--warn)}.btn.done{background:var(--acc);color:#1f2d20}
.btn+.btn,.btn+.row2,.row2+.btn{margin-top:10px}
.row2{display:flex;gap:10px}.row2>*{flex:1}
input,select,textarea{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font:500 18px Jost,system-ui,sans-serif;background:#fff;color:var(--ink)}
textarea{min-height:90px}label.f{display:block;font-size:15px;color:var(--mute);margin:10px 0 0;font-weight:700}label.f input{margin-top:4px}
.ring{position:relative;width:min(78vw,300px);margin:6px auto}.ring svg{width:100%;display:block}
.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mid b{font-size:56px;line-height:1;font-weight:800}.mid span{font-size:16px;color:var(--mute)}.mid i{font-size:13px;color:var(--mute);font-style:normal;margin-top:4px}
.sent{font-size:22px;font-weight:800;text-align:center;margin:8px 0}.small{font-size:16px;color:var(--mute);text-align:center;margin:2px 0}
.hint{font-size:15px;color:var(--mute);margin:6px 0}.ok{color:var(--accd);font-weight:800;font-size:16px;margin:8px 0}.err{color:var(--warn);font-weight:700;font-size:16px;margin:8px 0}
.seg{display:flex;background:#e9efe6;border-radius:14px;padding:4px;margin:10px 0}.seg button{flex:1;min-height:44px;border:0;border-radius:11px;background:none;font:800 16px Jost,system-ui,sans-serif;color:var(--accd)}.seg .on{background:#fff}
.it{display:flex;gap:10px;padding:12px 0;border-top:1px solid var(--line)}.it:first-child{border-top:0}.it .t{color:var(--mute);font-size:15px;min-width:46px}.it .n{font-weight:800}.it .m{font-size:15px;color:var(--mute)}
.est{background:#f1e7c8;color:#7a5d12;border-radius:6px;font-size:12px;padding:1px 6px;margin-left:6px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid .btn{min-height:76px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 14px;font:800 16px Jost,system-ui,sans-serif;min-height:46px}.chip.on{background:var(--accd);color:#fff;border-color:var(--accd)}
.pick{padding:12px;border:1.5px solid var(--line);border-radius:14px;margin:6px 0;background:#fff}.pick.on{border-color:var(--accd);background:#eef3ec}
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;min-height:54px;border:0;background:none;font:800 14px Jost,system-ui,sans-serif;color:var(--mute);border-radius:12px}.nav .on{color:var(--accd);background:#eef3ec}
.bar{position:sticky;top:0;z-index:5;background:#e9efe6;border-radius:14px;padding:10px 12px;margin-bottom:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar button{border:0;background:var(--accd);color:#fff;border-radius:10px;padding:8px 14px;font:800 16px Jost,system-ui,sans-serif;min-height:40px}
#modal{position:fixed;inset:0;background:rgba(30,40,32,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.show{display:flex}#modal>div{background:#fff;width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:16px}td,th{padding:8px 4px;text-align:left;border-top:1px solid var(--line)}th{color:var(--mute);font-size:14px;border:0}
img.prev{width:100%;border-radius:14px;margin:8px 0}

h2,h3,.sent,.mid b{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
h2{font-size:30px;letter-spacing:.01em}h3{font-size:22px}.sent{font-size:26px;line-height:1.2}.mid b{font-size:68px;font-weight:600}
body{font-weight:400}
.btn,.chip,.seg button,.bar button{text-transform:uppercase;letter-spacing:.12em;font-size:14px;font-weight:600;border-radius:2px}
.nav button{text-transform:uppercase;letter-spacing:.1em;font-size:11px;font-weight:600;border-radius:2px}
label.f{text-transform:uppercase;letter-spacing:.1em;font-size:12px;font-weight:500}
.card,.pick,.seg,.bar{border-radius:3px}input,select,textarea{border-radius:2px}.seg button{border-radius:2px}
.it .n{font-weight:600}.est{border-radius:2px;letter-spacing:.1em}
th{text-transform:uppercase;letter-spacing:.1em;font-size:11px}
.mid span,.small,.hint{letter-spacing:.02em}
</style></head><body><main id="main"></main>
<nav class="nav" id="nav"></nav><div id="modal"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0'),r=n=>Math.round(n),r1=n=>Math.round(n*10)/10;
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>dstr(new Date()),nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const num=v=>{v=parseFloat(v);return isFinite(v)&&v>0?v:0};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fd=d=>new Date(d+'T12:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
const FIX='Plate to cost, hand in shot for scale.';
/* ---------- storage ---------- */
let db;
const idbOpen=()=>new Promise((a,b)=>{const q=indexedDB.open('foodlog',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>{db=q.result;a()};q.onerror=()=>b(q.error)});
let get=k=>new Promise((a,b)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>a(q.result);q.onerror=()=>b(q.error)});
let put=(k,v)=>new Promise((a,b)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=a;t.onerror=()=>b(t.error)});
const defaults=()=>({items:[],labels:[],wants:[],daytype:{},targets:[{from:'0000-01-01',p:136,k:1500,fl:1400,ct:0,cr:0}]});
let S=defaults();
const KEYS=['items','labels','wants','daytype','targets'];
async function save(k){try{await put(k,S[k]);st.err='';return true}catch(e){st.err="Couldn't save on this phone. Tap the button to try again.";return false}}
/* ---------- helpers ---------- */
const tgt=d=>S.targets.filter(t=>t.from<=d).sort((a,b)=>a.from<b.from?-1:1).pop()||S.targets[0];
const dayItems=d=>S.items.filter(i=>i.date===d).sort((a,b)=>(a.time+a.at)<(b.time+b.at)?-1:1);
const sum=a=>a.reduce((o,i)=>({p:o.p+i.p,k:o.k+i.k,c:o.c+i.c,f:o.f+i.f}),{p:0,k:0,c:0,f:0});
const carbT=(d,T)=>T.ct&&T.cr?(S.daytype[d]==='rest'?T.cr:T.ct):(T.ct||T.cr||0);
const fig=i=>`P ${r1(i.p)} · ${r(i.k)} kcal · C ${r1(i.c)} · F ${r1(i.f)}`;
const labFig=(l,amt,grams)=>{const x=grams?grams/l.sg:amt;return{p:l.p*x,k:l.k*x,c:l.c*x,f:l.f*x,serve:grams?grams+' g':amt+(amt==1?' serve':' serves')+' ('+l.serve+')'}};
/* ---------- state ---------- */
let view='today';
const st={mode:null,ring:'p',time:nowT(),desc:'',paste:'',parsed:null,perr:'',lq:'',lab:null,amt:1,grams:'',man:{},ack:{},note:'',undo:null,lf:{},wq:'',tg:null,err:'',photo:null,photoURL:''};
const lastExp=()=>{try{const v=localStorage.getItem('lastExport');return v?new Date(v).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):''}catch(e){return''}};
/* ---------- add / edit logic ---------- */
async function addItems(list,time){
 const d=today(),now=Date.now();
 const dup=list.filter(n=>S.items.some(o=>o.date===d&&o.name.toLowerCase()===n.name.toLowerCase()&&now-o.at<180000));
 if(dup.length&&!await ask('You logged '+dup.map(x=>x.name).join(', ')+' a moment ago. Keep both?','Keep both','No, skip'))return false;
 const before=S.items.length;
 list.forEach(n=>S.items.push({id:uid(),date:d,time,at:now,name:n.name,serve:n.serve||'',p:n.p,k:n.k,c:n.c,f:n.f,est:n.est}));
 if(!await save('items')){S.items.length=before;return false}
 return true}
function parseAnswer(txt){
 let t=String(txt).trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
 const a=t.indexOf('{'),b=t.lastIndexOf('}');
 if(a<0||b<a)return{err:"That doesn't look like JSON, so nothing was read."};
 let o;try{o=JSON.parse(t.slice(a,b+1))}catch(e){return{err:"That isn't valid JSON, so nothing was read ("+e.message+")."}}
 if(!o||!Array.isArray(o.items)||!o.items.length)return{err:"The answer has no \"items\" list, so nothing was read."};
 const items=[];
 for(const x of o.items){const n=v=>{v=parseFloat(v);return isFinite(v)&&v>=0?v:NaN};
  const it={name:String(x.name||'').trim(),serve:String(x.serve||''),p:n(x.p),k:n(x.k),c:n(x.c||0),f:n(x.f||0),est:x.est!==false};
  if(!it.name||[it.p,it.k,it.c,it.f].some(isNaN))return{err:"One of the items is missing a name or has a number that isn't readable, so nothing was read."};
  items.push(it)}
 return{ok:{items,seen:String(o.seen||''),err:Math.max(0,parseFloat(o.error_kcal)||0),question:String(o.question||'')}}}
function applyEdit(id,v){const i=S.items.find(x=>x.id===id);if(!i)return false;Object.assign(i,v);return save('items')}
async function removeItem(id){const i=S.items.find(x=>x.id===id);S.items=S.items.filter(x=>x.id!==id);if(!await save('items')){S.items.push(i);return false}st.undo=i;return true}
async function undoDel(){if(!st.undo)return;S.items.push(st.undo);const n=st.undo.name;st.undo=null;if(await save('items'))st.note='Put back '+n+' at '+nowT();render()}
const buildExport=()=>JSON.stringify({app:'foodlog',version:1,exportedAt:new Date().toISOString(),data:KEYS.reduce((o,k)=>(o[k]=S[k],o),{})},null,1);
async function applyImport(txt){let o;try{o=JSON.parse(txt)}catch(e){return"That file isn't valid JSON."}
 const d=o&&o.data;if(!d||!Array.isArray(d.items)||!Array.isArray(d.labels)||!Array.isArray(d.targets)||!d.targets.length)return"That doesn't look like a Food log backup.";
 const old=S;S=Object.assign(defaults(),d);try{for(const k of KEYS)await put(k,S[k])}catch(e){S=old;return"Couldn't save the imported data. Your existing data is untouched."}return''}
/* ---------- modal ---------- */
const modal=h=>{const m=$('#modal');m.innerHTML=h?'<div>'+h+'</div>':'';m.classList.toggle('show',!!h)};
let _res;
let ask=(msg,ok='Yes',no='Cancel')=>new Promise(res=>{_res=res;modal(`<h3>${esc(msg)}</h3><button class="btn" onclick="ans(true)">${esc(ok)}</button><button class="btn alt" onclick="ans(false)">${esc(no)}</button>`)});
const ans=v=>{modal('');_res&&_res(v)};
/* ---------- views ---------- */
function ring(rad,fr,col){const C=2*Math.PI*rad;return `<circle cx="120" cy="120" r="${rad}" fill="none" stroke="var(--track)" stroke-width="17"/>`+(fr>0?`<circle cx="120" cy="120" r="${rad}" fill="none" stroke="${col}" stroke-width="17" stroke-linecap="round" stroke-dasharray="${C*Math.min(fr,1)} ${C}" transform="rotate(-90 120 120)"/>`:'')}
function vToday(){
 const d=today(),T=tgt(d),it=dayItems(d),s=sum(it),ct=carbT(d,T),pl=T.p-s.p,kl=T.k-s.k,P=st.ring==='p';
 const a=T.fl/T.k*2*Math.PI-Math.PI/2,x=Math.cos(a),y=Math.sin(a);
 const estK=it.filter(i=>i.est).reduce((o,i)=>o+i.k,0);
 const sent=(pl>0?r(pl)+' g protein to go':'Protein target reached')+', '+(kl>=0?'about '+r(kl)+' kcal left':r(-kl)+' kcal over for today');
 return (st.err?`<div class="err">${esc(st.err)}</div>`:'')+
 (st.undo?`<div class="bar"><span>Deleted ${esc(st.undo.name)}</span><button onclick="undoDel()">Undo</button></div>`:st.note?`<div class="bar"><span>${esc(st.note)}</span></div>`:'')+
 `<div class="ring" onclick="st.ring=st.ring==='p'?'k':'p';render()"><svg viewBox="0 0 240 240">${ring(104,s.p/T.p,'var(--accd)')}${ring(80,s.k/T.k,s.k>T.k?'var(--warn)':'var(--acc)')}<line x1="${120+x*69}" y1="${120+y*69}" x2="${120+x*91}" y2="${120+y*91}" stroke="var(--ink)" stroke-width="3.5" stroke-linecap="round"/></svg>
 <div class="mid"><b>${r(P?s.p:s.k)}</b><span>of ${P?T.p+' g protein':T.k+' kcal'}</span><i>tap to show ${P?'calories':'protein'}</i></div></div>
 <div class="sent">${sent}</div>
 <div class="small">Carbs ${r(s.c)} g${ct?' of '+ct:''} · Fat ${r(s.f)} g</div>
 <div class="small">The tick on the inner ring is your ${T.fl} kcal floor</div>
 ${T.ct&&T.cr?`<div class="seg"><button class="${S.daytype[d]!=='rest'?'on':''}" onclick="setDay('training')">Training day</button><button class="${S.daytype[d]==='rest'?'on':''}" onclick="setDay('rest')">Rest day</button></div>`:''}
 <h2 style="margin-top:18px">Today's log</h2><div class="card">${it.length?it.map(i=>`<div class="it" onclick="edit('${i.id}')"><div class="t">${i.time}</div><div><div class="n">${esc(i.name)}${i.est?'<span class="est">EST</span>':''}</div><div class="m">${esc(i.serve)}</div><div class="m">${fig(i)}</div></div></div>`).join(''):'<div class="hint">Nothing logged yet. Tap Add to start.</div>'}</div>
 ${it.length&&s.k?`<div class="small">${r(estK/s.k*100)}% of today's calories are estimated</div>`:''}
 <div class="small" style="margin-top:14px">${lastExp()?'Last backup: '+lastExp():'No backup yet. Open More to export one.'}</div>`}
const setDay=async v=>{S.daytype[today()]=v;await save('daytype');render()};
function edit(id){const i=S.items.find(x=>x.id===id);if(!i)return;st.note='';st.undo=null;
 modal(`<h3>Edit item</h3><label class="f">Name<input id="e_n" value="${esc(i.name)}"></label><label class="f">Portion<input id="e_s" value="${esc(i.serve)}"></label><label class="f">Time<input id="e_t" type="time" value="${i.time}"></label>
 <div class="row2"><label class="f">Protein g<input id="e_p" type="number" inputmode="decimal" step="any" value="${i.p}"></label><label class="f">Calories<input id="e_k" type="number" inputmode="decimal" step="any" value="${i.k}"></label></div>
 <div class="row2"><label class="f">Carbs g<input id="e_c" type="number" inputmode="decimal" step="any" value="${i.c}"></label><label class="f">Fat g<input id="e_f" type="number" inputmode="decimal" step="any" value="${i.f}"></label></div>
 <label class="f"><input id="e_e" type="checkbox" style="width:24px;min-height:24px" ${i.est?'checked':''}> Estimate (not read off a label)</label>
 <div id="e_err" class="err"></div><button class="btn" onclick="editSave('${id}')">Save</button><button class="btn red" onclick="editDel('${id}')">Delete</button><button class="btn alt" onclick="modal('')">Cancel</button>`)}
async function editSave(id){const g=x=>document.getElementById(x),n=g('e_n').value.trim();if(!n){g('e_err').textContent='Please give it a name.';return}
 const ok=await applyEdit(id,{name:n,serve:g('e_s').value,time:g('e_t').value||nowT(),p:num(g('e_p').value),k:num(g('e_k').value),c:num(g('e_c').value),f:num(g('e_f').value),est:g('e_e').checked});
 if(!ok){g('e_err').textContent=st.err;return}modal('');st.note='Updated '+n+' at '+nowT();render()}
async function editDel(id){modal('');if(!await ask('Delete this item?','Delete','Keep it'))return;if(await removeItem(id))st.note='';render()}
const modes={photo:'Snap the plate',text:'Describe what you ate',label:'Something with a label',manual:'Not in the list'};
function vAdd(){
 return (st.err?`<div class="err">${esc(st.err)}</div>`:'')+`<h2>Add food</h2><div class="grid">${Object.keys(modes).map(m=>`<button class="btn ${st.mode===m?'':'alt'}" onclick="setMode('${m}')">${modes[m]}</button>`).join('')}</div>`+
 (st.mode?`<div class="card" style="margin-top:14px"><label class="f" style="margin-top:0">Time of the meal<input type="time" value="${st.time}" oninput="st.time=this.value"></label>${panel()}</div>`:'')}
const setMode=m=>{st.mode=m;st.time=nowT();st.ack={};st.parsed=null;render()};
const ackLine=k=>st.ack[k]?`<div class="ok">${esc(st.ack[k])}</div>`:'';
function panel(){const m=st.mode;
 if(m==='photo'||m==='text')return (m==='photo'?`<label class="btn" for="cam" style="margin-top:12px">${st.photoURL?'Retake photo':'Snap the plate'}</label><input id="cam" type="file" accept="image/*" capture="environment" hidden onchange="gotPhoto(this)">
  ${st.photoURL?`<img class="prev" src="${st.photoURL}"><button class="btn alt" onclick="sharePhoto()">Share photo to Claude</button>`:''}${ackLine('photo')}<div class="hint">${FIX}</div>`:
  `<label class="f">What did you eat?<textarea oninput="st.desc=this.value" placeholder="half a plate of chicken rice, no skin">${esc(st.desc)}</textarea></label>`)+
  `<button class="btn alt" onclick="copyPrompt()">${st.ack.copy?'Copied':'Copy costing prompt'}</button>${ackLine('copy')}<div class="hint">Paste it into Claude${m==='photo'?' with the photo':''}, then paste the answer here.</div>
  <label class="f">Paste Claude's answer<textarea oninput="st.paste=this.value" placeholder='{"items":[...]}'>${esc(st.paste)}</textarea></label>
  <button class="btn" onclick="readAnswer()">Read the answer</button>${st.perr?`<div class="err">${esc(st.perr)}</div>`:''}${parsedView()}`;
 if(m==='label'){const q=st.lq.toLowerCase(),L=S.labels.filter(l=>l.name.toLowerCase().includes(q));
  const sel=S.labels.find(l=>l.id===st.lab);
  return `<label class="f">Search my labels<input value="${esc(st.lq)}" oninput="st.lq=this.value;document.getElementById('ll').innerHTML=labList()"></label><div id="ll">${labList()}</div>`+
  (sel?`<div class="chips">${[0.5,1,1.5,2].map(a=>`<button class="chip ${!st.grams&&st.amt===a?'on':''}" onclick="st.amt=${a};st.grams='';render()">${a} serve${a==1?'':'s'}</button>`).join('')}</div>
  <label class="f">Or grams${sel.sg?'':' (add the serve weight in My labels first)'}<input type="number" inputmode="decimal" value="${esc(st.grams)}" ${sel.sg?'':'disabled'} oninput="st.grams=this.value;document.getElementById('lp').innerHTML=labPrev()"></label>
  <div id="lp" class="hint">${labPrev()}</div><button class="btn ${st.ack.label?'done':''}" onclick="addLabel()">${st.ack.label?'Saved':'Add to today'}</button>${ackLine('label')}`:(S.labels.length?'':'<div class="hint">You have no labels yet. Add one in My labels.</div>'))}
 const M=st.man;const f=(k,t,ty)=>`<label class="f">${t}<input ${ty?'type="number" inputmode="decimal" step="any"':''} value="${esc(M[k]||'')}" oninput="st.man.${k}=this.value"></label>`;
 return f('name','Name')+f('serve','Portion')+`<div class="row2">${f('p','Protein g',1)}${f('k','Calories',1)}</div><div class="row2">${f('c','Carbs g',1)}${f('f','Fat g',1)}</div>
  <label class="f"><input type="checkbox" style="width:24px;min-height:24px" ${M.label?'checked':''} onchange="st.man.label=this.checked"> Read off a label (no EST tag)</label>
  <div id="merr">${st.perr?`<div class="err">${esc(st.perr)}</div>`:''}</div><button class="btn ${st.ack.man?'done':''}" onclick="addManual()">${st.ack.man?'Saved':'Add to today'}</button>${ackLine('man')}`}
function labList(){const q=st.lq.toLowerCase();const L=S.labels.filter(l=>l.name.toLowerCase().includes(q));
 return L.map(l=>`<div class="pick ${st.lab===l.id?'on':''}" onclick="st.lab='${l.id}';st.ack={};render()"><b>${esc(l.name)}</b><div class="m hint">${esc(l.serve)} · ${fig(l)}</div></div>`).join('')||'<div class="hint">No match.</div>'}
function labPrev(){const l=S.labels.find(x=>x.id===st.lab);if(!l)return'';const g=num(st.grams);if(g&&!l.sg)return'';const x=labFig(l,st.amt,g);return esc(x.serve)+': '+fig(x)}
function parsedView(){const p=st.parsed;if(!p)return'';
 return `<div class="card" style="margin-top:12px">${p.seen?`<div class="hint">Claude saw: ${esc(p.seen)}</div>`:''}${p.items.map(i=>`<div class="it"><div><div class="n">${esc(i.name)}${i.est?'<span class="est">EST</span>':''}</div><div class="m">${esc(i.serve)}</div><div class="m">${fig(i)}</div></div></div>`).join('')}
 ${p.err?`<div class="hint">Give or take ${r(p.err)} kcal</div>`:''}${p.question?`<div class="err" style="color:var(--ink)">Claude asks: ${esc(p.question)}</div>`:''}
 <button class="btn ${st.ack.cost?'done':''}" style="margin-top:10px" onclick="addParsed()">${st.ack.cost?'Saved':'Add to today at '+st.time}</button>${ackLine('cost')}</div>`}
async function gotPhoto(inp){const f=inp.files&&inp.files[0];if(!f)return;st.photo=f;st.photoURL=URL.createObjectURL(f);try{await put('photo',f);st.ack.photo='Photo kept '+nowT()}catch(e){st.ack.photo='Photo is showing here but could not be kept on this phone.'}render()}
async function sharePhoto(){const f=st.photo;try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],text:FIX});else st.perr="Sharing isn't available here. Press and hold the photo to save it, then add it in Claude."}catch(e){if(e.name!=='AbortError')st.perr="Couldn't share the photo. Try again."}render()}
const RULES=`You cost food for one person's food log. Answer ONLY in the JSON shape given.

Open and look at the photo before costing it. Never cost a photo you have not looked at.

Assume I have already eaten it. Do not ask whether I ate it.

My hand is usually flat beside the food. Use it as the scale for portions. If there is no hand, say so and lean towards a typical portion, not a large one.

MY NOTE WINS over what the photo suggests. If I say "half the bowl" or "200 g cooked chicken", use exactly that.

Packaged products: if it matches one of my saved labels, use those figures and set est false. If the front of the pack shows different figures from my label, it is a new version: use the front and say so. If you read numbers off the pack in the photo, est false for those. Anything you could not read is an estimate (est true). Never present a guess as if it came off a pack.

One item per distinct food (rice, chicken, egg, sauce). Short plain names. "serve" says the portion, cooked or raw, and how you sized it.

Cooked weights use cooked figures, raw weights use raw figures. Never mix them.

Count visible oil and sauces. Restaurant and hawker food usually carries more oil than home cooking.

Protein x 4 can never be more than the calories.

"error_kcal": how far off the whole plate could honestly be (about 100 for a simple clear plate, 250 for a mixed dish with hidden oil, 0 if everything was read off packs).

"question": empty unless one fact would change the numbers a lot. One short question at most.

With no photo (a description only): cost from my words alone, use my amounts exactly, and assume a typical portion where I give none.

JSON shape: {"items":[{"name":"","serve":"","p":0,"k":0,"c":0,"f":0,"est":true}],"seen":"","error_kcal":0,"question":""}`;
const buildPrompt=()=>RULES+'\n\nMy saved labels (per serve: protein g, kcal, carbs g, fat g):\n'+(S.labels.length?S.labels.map(l=>`- ${l.name}, serve ${l.serve}: P ${l.p}, ${l.k} kcal, C ${l.c}, F ${l.f}`).join('\n'):'(none yet)')+'\n\nTime of the meal: '+st.time+'\n'+(st.mode==='text'?'My description: '+(st.desc||'(not written yet)'):'The photo is attached.');
async function copyPrompt(){const t=buildPrompt();let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();ok=document.execCommand('copy');a.remove()}catch(e2){}}
 st.ack.copy=ok?'Copied '+nowT()+'. Now paste it into Claude.':'';st.perr=ok?'':"Couldn't copy. Try again.";render()}
function readAnswer(){const o=parseAnswer(st.paste);st.ack.cost='';if(o.err){st.parsed=null;st.perr=o.err+' What you pasted is still in the box. Fix it and tap again.'}else{st.perr='';st.parsed=o.ok}render()}
async function addParsed(){const ok=await addItems(st.parsed.items,st.time);if(ok){st.ack.cost='Added '+nowT();st.paste=''}else st.perr=st.err||'Not added.';render()}
async function addLabel(){const l=S.labels.find(x=>x.id===st.lab),g=num(st.grams);if(!l)return;const x=labFig(l,st.amt,g);
 const ok=await addItems([{name:l.name,serve:x.serve,p:x.p,k:x.k,c:x.c,f:x.f,est:false}],st.time);st.ack.label=ok?'Added '+nowT():'';st.perr=ok?'':(st.err||'Not added.');render()}
async function addManual(){const M=st.man;if(!(M.name||'').trim()){st.perr='Please give it a name.';render();return}
 const ok=await addItems([{name:M.name.trim(),serve:M.serve||'',p:num(M.p),k:num(M.k),c:num(M.c),f:num(M.f),est:!M.label}],st.time);
 if(ok){st.ack.man='Added '+nowT();st.man={};st.perr=''}else st.perr=st.err||'Not added.';render()}
/* labels */
function vLabels(){const L=st.lf,f=(k,t,ty)=>`<label class="f">${t}<input ${ty?'type="number" inputmode="decimal" step="any"':''} value="${esc(L[k]||'')}" oninput="st.lf.${k}=this.value"></label>`;
 return `<h2>My labels</h2>${S.labels.map(l=>`<div class="card"><b>${esc(l.name)}</b> <span class="est" style="background:#dfe9dc;color:var(--accd)">From a real pack</span><div class="hint">${esc(l.serve)}${l.sg?' ('+l.sg+' g)':''} · ${fig(l)}</div><div class="row2"><button class="btn alt" onclick="editLabel('${l.id}')">Edit</button><button class="btn red" onclick="delLabel('${l.id}')">Delete</button></div></div>`).join('')||'<div class="hint">No labels yet.</div>'}
 <div class="card"><h3>${L.id?'Edit label':'Add a label you have photographed'}</h3><div class="hint">Type the figures in from the label photo, per serve. Nothing is pre-filled.</div>${f('name','Product name')}${f('serve','Serve size (for example 1 tub, 30 g)')}${f('sg','Serve in grams (needed to log by grams)',1)}
 <div class="row2">${f('p','Protein g',1)}${f('k','Calories',1)}</div><div class="row2">${f('c','Carbs g',1)}${f('f','Fat g',1)}</div>${st.perr&&view==='labels'?`<div class="err">${esc(st.perr)}</div>`:''}
 <button class="btn ${st.ack.lab?'done':''}" style="margin-top:12px" onclick="saveLabel()">${st.ack.lab?'Saved':'Save label'}</button>${ackLine('lab')}</div>
 <h2>Needs a label</h2><div class="card"><div class="hint">Foods you eat often but have not photographed yet.</div>${S.wants.map((w,i)=>`<div class="it" style="align-items:center"><div style="flex:1" class="n">${esc(w)}</div><button class="chip" onclick="useWant(${i})">Add label</button><button class="chip" onclick="rmWant(${i})">Remove</button></div>`).join('')}
 <div class="row2" style="margin-top:8px"><input id="wn" placeholder="Food name" value="${esc(st.wq)}" oninput="st.wq=this.value"><button class="btn" style="flex:0 0 90px" onclick="addWant()">Add</button></div></div>`}
async function saveLabel(){const L=st.lf,name=(L.name||'').trim();st.ack.lab='';
 if(!name||!(L.serve||'').trim()||!num(L.k)){st.perr='Please fill in the name, serve size and calories.';render();return}
 const o={id:L.id||uid(),name,serve:L.serve.trim(),sg:num(L.sg),p:num(L.p),k:num(L.k),c:num(L.c),f:num(L.f)};const i=S.labels.findIndex(x=>x.id===o.id);const old=S.labels.slice();
 if(i>=0)S.labels[i]=o;else S.labels.push(o);if(!await save('labels')){S.labels=old;st.perr=st.err;render();return}
 S.wants=S.wants.filter(w=>w.toLowerCase()!==name.toLowerCase());await save('wants');st.perr='';st.lf={};st.ack.lab='Saved '+name+' at '+nowT();render()}
const editLabel=id=>{const l=S.labels.find(x=>x.id===id);st.lf=Object.assign({},l);st.ack={};st.perr='';render();scrollTo(0,document.body.scrollHeight)};
async function delLabel(id){if(!await ask('Delete this label?','Delete','Keep it'))return;S.labels=S.labels.filter(x=>x.id!==id);await save('labels');render()}
const useWant=i=>{st.lf={name:S.wants[i]};st.ack={};render();scrollTo(0,0)};
async function rmWant(i){S.wants.splice(i,1);await save('wants');render()}
async function addWant(){const w=st.wq.trim();if(!w)return;S.wants.push(w);st.wq='';await save('wants');render()}
function vHistory(){const rows=[];for(let i=1;i<=7;i++){const d=new Date();d.setDate(d.getDate()-i);const k=dstr(d),it=dayItems(k),T=tgt(k);rows.push({k,T,has:!!it.length,s:sum(it)})}
 const has=rows.filter(x=>x.has),av=a=>has.length?r(has.reduce((o,x)=>o+x.s[a],0)/has.length):'';
 return `<h2>Last 7 days</h2><div class="card"><table><tr><th>Day</th><th>Protein</th><th>Calories</th></tr>${rows.map(x=>x.has?`<tr><td>${fd(x.k)}</td><td>${r(x.s.p)} g ${x.s.p>=x.T.p?'✓':'✗'}</td><td>${r(x.s.k)} ${x.s.k>=x.T.fl?'✓':'✗'}</td></tr>`:`<tr><td>${fd(x.k)}</td><td></td><td></td></tr>`).join('')}</table>
 <div class="hint">✓ on protein means the target was reached. ✓ on calories means you stayed at or above your floor. Blank means nothing was logged.</div>${has.length?`<div class="sent" style="font-size:19px;text-align:left">Average: ${av('p')} g protein, ${av('k')} kcal (${has.length} day${has.length>1?'s':''} logged)</div>`:''}</div>`}
function vMore(){const T=st.tg||(st.tg=Object.assign({},tgt(today()))),f=(k,t,h)=>`<label class="f">${t}<input type="number" inputmode="decimal" step="any" value="${T[k]||''}" oninput="st.tg.${k}=this.value" ${h?'placeholder="optional"':''}></label>`;
 return `<h2>My targets</h2><div class="card">${f('p','Protein (g)')}${f('k','Calories (kcal)')}${f('fl','Calorie floor (kcal)')}${f('ct','Carbs, training day (g)',1)}${f('cr','Carbs, rest day (g)',1)}
 <div class="hint">A change applies from today on. Past days keep the target they had.</div>${st.perr&&view==='more'?`<div class="err">${esc(st.perr)}</div>`:''}<button class="btn ${st.ack.tg?'done':''}" onclick="saveTargets()">${st.ack.tg?'Saved':'Save targets'}</button>${ackLine('tg')}</div>
 <h2>Back up</h2><div class="card"><div class="hint">Last backup: ${lastExp()||'never'}</div><button class="btn" onclick="doExport()">Export my data</button>${ackLine('ex')}
 <label class="btn alt" for="imp" style="margin-top:10px">Import a backup</label><input id="imp" type="file" accept="application/json,.json" hidden onchange="doImport(this)">${ackLine('im')}${st.perr&&view==='more'&&st.ack.imerr?`<div class="err">${esc(st.perr)}</div>`:''}
 <div class="hint">Photos are not part of the backup.</div></div>`}
async function saveTargets(){const T=st.tg,n={from:today(),p:num(T.p),k:num(T.k),fl:num(T.fl),ct:num(T.ct),cr:num(T.cr)};st.ack.tg='';
 if(!n.p||!n.k||!n.fl){st.perr='Protein, calories and floor all need a number.';render();return}
 if(n.fl>n.k){st.perr='The floor can not be higher than your calorie target.';render();return}
 const old=S.targets.slice();S.targets=S.targets.filter(t=>t.from!==n.from);S.targets.push(n);
 if(!await save('targets')){S.targets=old;st.perr=st.err;render();return}st.perr='';st.ack.tg='Saved '+nowT()+'. Applies from today.';render()}
async function doExport(){const txt=buildExport(),name='food-log-'+today()+'.json',file=new File([txt],name,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});else{const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove()}
  localStorage.setItem('lastExport',new Date().toISOString());st.ack.ex='Exported '+nowT()+'. Keep the file somewhere safe.'}
 catch(e){st.ack.ex=e.name==='AbortError'?'Export cancelled. Nothing was saved.':''; if(e.name!=='AbortError'){st.perr="Couldn't export. Try again.";st.ack.imerr=1}}render()}
async function doImport(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;st.ack.imerr='';let txt;try{txt=await f.text()}catch(e){st.perr="Couldn't read that file.";st.ack.imerr=1;render();return}
 if(!await ask('Replace everything on this phone with this backup?','Replace','Cancel'))return;const e=await applyImport(txt);
 if(e){st.perr=e;st.ack.imerr=1}else{st.ack.im='Imported '+nowT()+'. Your data is now the backup.';st.tg=null}render()}
/* ---------- shell ---------- */
const views={today:vToday,add:vAdd,labels:vLabels,history:vHistory,more:vMore},names={today:'Today',add:'Add',labels:'Labels',history:'History',more:'More'};
function render(){$('#main').innerHTML=views[view]();$('#nav').innerHTML=Object.keys(names).map(k=>`<button class="${view===k?'on':''}" onclick="go('${k}')">${names[k]}</button>`).join('')}
function go(v){view=v;st.ack={};st.perr='';st.err='';if(v==='more')st.tg=null;if(v!=='today'){st.note='';st.undo=null}render();scrollTo(0,0)}
async function init(){try{await idbOpen();for(const k of KEYS){const v=await get(k);if(v!==undefined)S[k]=v}}catch(e){st.err="Your data couldn't be opened on this phone. Anything you add may not be kept."}
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});render()}
if(!window.__test)init();
</script></body></html>
